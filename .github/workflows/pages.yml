# Bouwt de HitStory-pagina's (sorock.nl/encyclopedie) op GitHub en publiceert de hele site.
# Invoer: bouw/encyclopedie (script, stijl, factcheck) + release-bestand "bron" (lemmas.json en hoezen.json, gemaakt door verzamel.ts op de pc).
name: Site bouwen en publiceren
on:
  push:
    branches: [main]
    paths: ["bouw/encyclopedie/bewerkt/**", "bouw/encyclopedie/bewerkt-en/**"]
  workflow_dispatch:
    inputs:
      publiceer:
        description: "Ook publiceren (anders alleen bouwen en tellen)"
        type: boolean
        default: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Bron ophalen
        run: |
          mkdir -p bouw/encyclopedie/data
          curl -fsSL -o bron.tgz "https://github.com/${{ github.repository }}/releases/download/bron/bron.tgz"
          tar -xzf bron.tgz -C bouw/encyclopedie/data
          ls -la bouw/encyclopedie/data
      - name: Bewerkte teksten toepassen
        run: deno run -A bouw/encyclopedie/pas-toe.ts
      - name: Pagina's bouwen
        run: deno run -A bouw/encyclopedie/maak.ts
      - name: Sitemap bijwerken
        run: deno run -A bouw/encyclopedie/sitemap.ts
      - name: Samenvoegen met de site en sitemap bijwerken
        run: |
          rm -rf encyclopedie en/encyclopedie
          mv bouw/site/encyclopedie encyclopedie
          mkdir -p en
          mv bouw/site/en/encyclopedie en/encyclopedie
          rm -rf bouw bron.tgz .git .github
          echo "pagina's in encyclopedie: $(find encyclopedie -name '*.html' | wc -l)"
          test "$(find encyclopedie -name '*.html' | wc -l)" -gt 15000
          test -s encyclopedie/zoek.json
          echo "pagina's in en/encyclopedie: $(find en/encyclopedie -name '*.html' | wc -l)"
          test -s en/encyclopedie/zoek.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  publiceer:
    needs: bouw
    if: github.event_name == 'push' || inputs.publiceer
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
